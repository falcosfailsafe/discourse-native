# libwebrtc prebuilt binary release info.
# See https://github.com/webrtc-sdk/libwebrtc/releases for available versions.
# `download_url` is the base release-download URL; the version tag, asset name
# and `.zip` suffix are appended at configure time by third_party/CMakeLists.txt.
[libwebrtc]
binary_version = libwebrtc.m150.7871.07
download_url   = https://github.com/webrtc-sdk/libwebrtc/releases/download
# Custom Windows x64 build (falcosfailsafe/libwebrtc, tool/libwebrtc). Built and
# C++-unit-tested in CI. .3 adds the DXGI texture-format fix from the hardware
# test. .4 guards wrapper peer-connection calls after Close() (teardown crash
# at +0x218f7). .5 stops DXGI output enumeration on any failure instead of
# crashing in GetCapabilities when no display is available. Verified on a Tesla
# T4 (docs/voice-windows-acceptance.md); the RTX 5090 run is still pending.
# .6 re-probes a negative encoder capability after 3 s instead of caching it for
# the life of the process (a display fixed after launch now re-enables NVENC).
windows_binary_version = discourse.m150.7871.07.6
windows_download_url   = https://github.com/falcosfailsafe/libwebrtc/releases/download
windows_sha256         = 460ef53b5435aad5d4687f4632862b8b469504f3260f0e857198fa54c2c85a94
