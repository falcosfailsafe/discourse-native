name: Set up AVIF build tools
description: Build the pinned libavif native asset on Linux, Apple and Windows runners.
runs:
  using: composite
  steps:
    - name: Install codec build tools
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" == macOS ]]; then
          brew install cmake meson ninja nasm
        elif [[ "$RUNNER_OS" == Windows ]]; then
          # cmake, ninja and rustup ship on the hosted Windows image. Meson is
          # not guaranteed there and NASM is only guaranteed at its install
          # path, so install what is missing and put NASM on PATH.
          python -m pip install --disable-pip-version-check meson
          if ! command -v nasm >/dev/null; then
            choco install nasm --no-progress -y
          fi
          for dir in "/c/Program Files/NASM" "/c/Program Files (x86)/NASM"; do
            if [[ -x "$dir/nasm.exe" ]]; then
              echo "$(cygpath -w "$dir")" >> "$GITHUB_PATH"
            fi
          done
          command -v ninja >/dev/null || choco install ninja --no-progress -y
          command -v cmake >/dev/null || choco install cmake --no-progress -y
        else
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake meson ninja-build nasm
        fi

    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --no-modify-path --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        rustup toolchain install 1.92.0 --profile minimal
        # Select the toolchain explicitly so libavif's manifest does not install
        # unrelated Android and Windows targets on every build machine.
        echo 'RUSTUP_TOOLCHAIN=1.92.0' >> "$GITHUB_ENV"
        if [[ "$RUNNER_OS" == macOS ]]; then
          rustup target add --toolchain 1.92.0 aarch64-apple-darwin x86_64-apple-darwin \
            aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
        fi
