name: ci

# The README's Checks section is the gate; this is the gate running.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Run Windows format, analyze and bundle verification only'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.windows_only != true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve application and native bridge graphs
        run: |
          flutter pub get --enforce-lockfile
          (cd packages/discourse_voice && flutter pub get --enforce-lockfile)
          (cd profiles/full && flutter pub get --enforce-lockfile)

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib test integration_test tool \
            packages/discourse_voice/lib \
            packages/discourse_voice/tool \
            profiles/full/lib

      - name: Analyze
        run: |
          flutter analyze
          (cd packages/discourse_voice && flutter analyze)
          (cd profiles/full && flutter analyze)

      - name: Set up AVIF build tools
        # Native AVIF is built during Flutter tests as well as application builds.
        uses: ./.github/actions/setup-avif

      - name: Test
        run: |
          flutter test --test-randomize-ordering-seed=random
          (cd profiles/full && flutter test ../../test/bundled_fonts_test.dart)

  linux-bundle:
    # Keep the native plugin graph buildable between releases without turning
    # every check into a release/package build.
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Test libwebrtc build contracts
        # CMake is installed above; the native tests need no libwebrtc.
        run: |
          set -euxo pipefail
          python3 -m unittest discover -s tool/libwebrtc -p 'test_*.py' -v
          bash tool/libwebrtc/run_native_tests.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve root and compatibility package graphs
        run: |
          flutter pub get --enforce-lockfile
          (cd profiles/full && flutter pub get --enforce-lockfile)

      - name: Set up AVIF build tools
        uses: ./.github/actions/setup-avif

      - name: Build root and compatibility Linux bundles
        run: |
          flutter build linux --debug
          (cd profiles/full && flutter build linux --debug)

      - name: Smoke-check both always-bundled artifacts
        run: |
          set -euxo pipefail
          core=build/linux/x64/debug/bundle/discourse_native
          full=profiles/full/build/linux/x64/debug/bundle/discourse_native
          test -x "$core"
          test -x "$full"
          core_dependencies="$(ldd "$core")"
          full_dependencies="$(ldd "$full")"
          printf '%s\n' "$core_dependencies"
          printf '%s\n' "$full_dependencies"
          ! grep -q 'not found' <<< "$core_dependencies"
          ! grep -q 'not found' <<< "$full_dependencies"

          # Every application composition includes Voice and both native
          # media plugins.
          LC_ALL=C grep -aFq 'FlutterWebRTCPlugin' "$core"
          LC_ALL=C grep -aFq 'LiveKitPlugin' "$core"
          LC_ALL=C grep -aFq 'FlutterWebRTCPlugin' "$full"
          LC_ALL=C grep -aFq 'LiveKitPlugin' "$full"

  windows-bundle:
    # Voice screen share targets Windows (docs/plans/voice-hardware-encoding.md).
    # Keep the runner, the pinned custom libwebrtc download and the plugin graph
    # buildable. The full test suite stays on Linux.
    needs: checks
    if: always() && (needs.checks.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.windows_only == true))
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        # dart format --set-exit-if-changed rejects CRLF rewrites of the tree.
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Move to a short path
        # libavif's native build nests CMake scratch directories under
        # .dart_tool; from D:\a\<repo>\<repo> they exceed MSVC's 260-character
        # limit and fail with C1083. Use a real short directory (a subst drive
        # would be resolved back to the long path).
        run: |
          mkdir -p /c/w
          cp -a "$GITHUB_WORKSPACE/." /c/w/

      - name: Resolve root and compatibility package graphs
        working-directory: C:/w
        run: |
          flutter pub get --enforce-lockfile
          (cd packages/discourse_voice && flutter pub get --enforce-lockfile)

      - name: Check formatting
        working-directory: C:/w
        run: |
          dart format --output=none --set-exit-if-changed \
            lib test integration_test tool \
            packages/discourse_voice/lib \
            packages/discourse_voice/tool

      - name: Analyze
        working-directory: C:/w
        run: |
          flutter analyze
          (cd packages/discourse_voice && flutter analyze)

      - name: Set up AVIF build tools
        uses: ./.github/actions/setup-avif

      - name: Build Windows bundle
        working-directory: C:/w
        run: flutter build windows --debug

      - name: Smoke-check bundle
        working-directory: C:/w
        run: |
          set -euxo pipefail
          bundle=build/windows/x64/runner/Debug
          test -f "$bundle/discourse_native.exe"
          test -f "$bundle/flutter_windows.dll"
          # Voice's WebRTC plugin and the pinned custom libwebrtc it bundles.
          test -f "$bundle/flutter_webrtc_plugin.dll"
          test -f "$bundle/libwebrtc.dll"
          grep -aq LibWebRTCSharedScreenCreateSource "$bundle/libwebrtc.dll"
          test -f "$bundle/livekit_client_plugin.dll"

  apple-bundles:
    # Compile both application wrappers on Apple. Each must include the
    # Voice-owned CallKit bridge and media registrants.
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve root and compatibility package graphs
        run: |
          flutter pub get --enforce-lockfile
          (cd profiles/full && flutter pub get --enforce-lockfile)

      - name: Set up AVIF build tools
        uses: ./.github/actions/setup-avif

      - name: Build root macOS bundle
        # `flutter build macos` has no --no-codesign, and the Xcode project now
        # names the TestFlight team, which the runner has no certificate for.
        # Generate the Xcode configuration, then drive xcodebuild directly with
        # signing disabled — the same arrangement the iOS RunnerTests step uses.
        run: |
          set -euo pipefail
          flutter build macos --debug --config-only
          xcodebuild build \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -derivedDataPath build/macos-core-ci \
            CODE_SIGNING_ALLOWED=NO

      - name: Build root iOS simulator bundle
        run: flutter build ios --simulator --debug --no-codesign

      - name: Build compatibility macOS bundle
        run: |
          set -euo pipefail
          (cd profiles/full && flutter build macos --debug --config-only)
          xcodebuild build \
            -workspace profiles/full/macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -derivedDataPath build/macos-full-ci \
            CODE_SIGNING_ALLOWED=NO

      - name: Build compatibility iOS simulator bundle
        run: |
          cd profiles/full
          flutter build ios --simulator --debug --no-codesign

      - name: Test shared Apple coordinators
        run: swift test --package-path darwin

      - name: Test Apple video optimization
        run: swift test --package-path packages/discourse_video_optimizer

      - name: Test iOS native coordinator
        run: |
          set -euo pipefail
          destination_id="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["name"].startswith("iPhone")))'
          )"
          test -n "$destination_id"
          xcodebuild test \
            -workspace profiles/full/ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$destination_id" \
            -only-testing:RunnerTests \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO

      - name: Smoke-check native bundles
        run: |
          set -euo pipefail
          test -x build/macos-core-ci/Build/Products/Debug/Discourse.app/Contents/MacOS/Discourse
          test -x build/macos-full-ci/Build/Products/Debug/Discourse.app/Contents/MacOS/Discourse
          test -d build/ios/iphonesimulator/Runner.app
          test -d profiles/full/build/ios/iphonesimulator/Runner.app

          # The package-owned channel is compiled into every app.
          LC_ALL=C grep -aRqsF 'org.discourse.native/voice_callkit' \
            build/ios/iphonesimulator/Runner.app
          LC_ALL=C grep -aRqsF 'org.discourse.native/voice_callkit' \
            profiles/full/build/ios/iphonesimulator/Runner.app

  android-video-optimizer:
    if: github.event_name != 'workflow_dispatch' || inputs.windows_only != true
    # A disposable host checks the plugin until the app has an Android runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Build and test Android video plugin
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          video_host="$RUNNER_TEMP/video_optimizer_host"
          flutter create --platforms=android --project-name video_optimizer_host "$video_host"
          cd "$video_host"
          flutter pub add discourse_video_optimizer --path "$GITHUB_WORKSPACE/packages/discourse_video_optimizer"
          flutter build apk --debug
          cd android
          ./gradlew :discourse_video_optimizer:testDebugUnitTest
